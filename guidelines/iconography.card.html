<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flexDirection:column}.lbl{font-size:10px;letter-spacing:.06em;color:var(--text-muted);margin-top:6px;font-weight:600}</style></head><body><div id="row" class="row" style="gap:22px;color:var(--text-primary)"></div><script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script><script>const names=['arrow-right','arrow-up-right','check-circle','zap','plus','minus','send','phone','mail','moon','sun','menu','x','globe','search','wrench','lightbulb','cookie'];document.getElementById('row').innerHTML=names.map(n=>'<div style="text-align:center"><i data-lucide="'+n+'" style="width:24px;height:24px"></i><div class="lbl">'+n+'</div></div>').join('');lucide.createIcons();</script></body></html>
