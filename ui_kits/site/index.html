<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Сингулярность — главная</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="site-header.jsx"></script>
<script type="text/babel" src="site-footer.jsx"></script>
<script type="text/babel" src="home-screen.jsx"></script>
<script type="text/babel" src="contact-screen.jsx"></script>
<script type="text/babel" src="employee-screen.jsx"></script>
<script type="text/babel" src="automation-screen.jsx"></script>
<script type="text/babel" src="privacy-screen.jsx"></script>
<script type="text/babel">
const { CookieConsent } = window.DesignSystem_03bc73;
function App() {
  const [theme, setTheme] = React.useState('light');
  const [locale, setLocale] = React.useState('ru');
  const [cookie, setCookie] = React.useState(true);
  const [hash, setHash] = React.useState(window.location.hash);
  React.useEffect(() => {
    const on = () => { setHash(window.location.hash); if (!window.location.hash.startsWith('#automation') && !window.location.hash.startsWith('#sites') && window.location.hash !== '#team' && window.location.hash !== '#faq') window.scrollTo({ top: 0 }); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const route = hash === '#contact' ? 'contact' : hash === '#automation' ? 'automation' : hash === '#privacy' ? 'privacy' : hash.startsWith('#team/') ? 'employee' : 'home';
  const slug = route === 'employee' ? hash.slice('#team/'.length) : null;
  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.body.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  return (
    <>
      <AppHeader theme={theme} onToggleTheme={() => setTheme(theme === 'light' ? 'dark' : 'light')}
        locale={locale} onToggleLocale={() => setLocale(locale === 'ru' ? 'en' : 'ru')} />
      <main>
        {route === 'contact' ? <ContactScreen /> : route === 'automation' ? <AutomationScreen /> : route === 'privacy' ? <PrivacyScreen /> : route === 'employee' ? <EmployeeScreen slug={slug} /> : <HomeScreen />}
      </main>
      <AppFooter />
      {cookie ? (
        <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50 }}>
          <CookieConsent body="Этот сайт использует cookies для улучшения пользовательского опыта и анализа трафика. Продолжая использовать сайт, вы соглашаетесь с нашей"
            onAccept={() => setCookie(false)} onDecline={() => setCookie(false)} />
        </div>
      ) : null}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
