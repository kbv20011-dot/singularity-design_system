<script type="text/babel" src="site-header.jsx"></script>
<script type="text/babel" src="site-footer.jsx"></script>
<script type="text/babel" src="privacy-screen.jsx"></script>
<script type="text/babel">
function App() {
  const [theme, setTheme] = React.useState('light');
  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.body.classList.toggle('dark', theme === 'dark');
  }, [theme]);
  return (
    <>
      <AppHeader theme={theme} onToggleTheme={() => setTheme(theme === 'light' ? 'dark' : 'light')} />
      <main><PrivacyScreen /></main>
      <AppFooter />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
